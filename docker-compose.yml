version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: polymatrix-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polymatrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polymatrix2026}
      POSTGRES_DB: ${POSTGRES_DB:-polymatrix_rag}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - polymatrix_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polymatrix} -d ${POSTGRES_DB:-polymatrix_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polymatrix_pgdata:
    driver: local

